name: Build Extension

on:
  push:
    branches: [main, chrome-extension]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: node extension/test.js

      - name: Build extension zip
        run: |
          cd extension
          zip -r ../dxf-to-glowforge.zip . \
            -x "*.DS_Store" \
            -x "__MACOSX/*"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: dxf-to-glowforge-extension
          path: dxf-to-glowforge.zip

      - name: Attach zip to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "${{ github.ref_name }}" dxf-to-glowforge.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
