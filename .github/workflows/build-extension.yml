name: Build Extension

on:
  push:
    branches: [main, chrome-extension]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: node extension/test.js

      - name: Build extension zip
        run: |
          cd extension
          zip -r ../dxf-to-glowforge.zip . \
            -x "*.DS_Store" \
            -x "__MACOSX/*"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: dxf-to-glowforge-extension
          path: dxf-to-glowforge.zip
